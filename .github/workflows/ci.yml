name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install --yes libsdl2-dev
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test PC time sender
        run: python3 scripts/test_sync_time.py
      - name: Test resource-budget checker
        run: python3 scripts/test_check_resources.py
      - name: Test OTA updater without Bluetooth
        run: python3 scripts/test_ota_update.py
      - name: Test direct Bluetooth sender without a watch
        run: python3 scripts/test_direct_upload.py
      - name: Test stalled Bluetooth sender operations
        run: python3 scripts/test_direct_upload_timeouts.py
      - name: Test exclusive Bluetooth target sessions
        run: python3 scripts/test_ble_session.py
      - name: Test retained pairing trace decoder
        run: python3 scripts/test_pairing_probe.py
      - name: Test automated pairing harness without Bluetooth
        run: python3 scripts/test_pairing_harness.py
      - name: Test release assets
        run: python3 scripts/test_release_assets.py
      - name: Test browser updater and published release selection
        run: |
          node --test web/*.test.mjs
          python3 scripts/test_build_web.py
      - name: Check module files
        run: go mod tidy -diff
      - name: Build simulator
        run: go build .

  pinetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"
          install-binaryen: "false"
      - name: Build PineTime firmware
        run: tinygo build -target=./targets/pinetime-gopine.json -ldflags="-X main.firmwareTime=00:00:00" -o goPine.hex .
      - name: Build native goPine OTA package
        env:
          FIRMWARE_TIME: "00:00:00"
        run: bash scripts/build-ota.sh 0.2.0
      - uses: actions/checkout@v7
        with:
          repository: InfiniTimeOrg/InfiniTime
          ref: 6c119eb52206b580b556b41633dddc1e1b66a8da
          path: build/deps/InfiniTime
          persist-credentials: false
      - name: Install C port test tools
        run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - name: Test cooperative Bluetooth primitives
        run: python3 scripts/test-ble-port.py --infinitime build/deps/InfiniTime
      - name: Test Bluetooth host connections and restarts
        run: python3 scripts/test-ble-host.py --infinitime build/deps/InfiniTime
      - name: Test nRF52 Bluetooth peripheral shutdown
        run: python3 scripts/test-ble-phy.py --infinitime build/deps/InfiniTime --tinygo-root "$(tinygo env TINYGOROOT)"
      - name: Build experimental Bluetooth time-sync candidate
        env:
          FIRMWARE_TIME: "00:00:00"
          FIRMWARE_DATE: "2026-10-05"
        run: bash scripts/build-ota.sh --ble 0.3.1
      - name: Build wired recovery setup
        env:
          FIRMWARE_TIME: "00:00:00"
        run: bash scripts/build-ota.sh --bootstrap 0.2.0
